[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-colab"
version = "1.0.0"
description = "Production-grade All-in-One LoRA Training Suite for Google Colab & Cloud GPUs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Colab LoRA Studio Team"}
]
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "accelerate>=0.28.0",
    "transformers>=4.40.0",
    "diffusers>=0.28.0",
    "peft>=0.10.0",
    "safetensors>=0.4.2",
    "huggingface-hub>=0.23.0",
    "bitsandbytes>=0.43.0",
    "pillow>=10.2.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "toml>=0.10.2",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "google-genai>=0.1.0",
    "openai>=1.20.0",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime-gpu>=1.17.0",
    "numpy>=1.24.0",
]
vision = [
    "opencv-python-headless>=4.9.0",
    "einops>=0.7.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
lora-colab = "lora_colab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
