[dataset]
dataset_dir = "/content/drive/MyDrive/Colab_LoRA_Studio/datasets/01_character"
repeats = 10
task_type = "character"
resolution = 512
enable_bucketing = true
min_bucket_res = 384
max_bucket_res = 768
caption_extension = ".txt"
shuffle_caption = true
keep_tokens = 1

[network]
network_module = "networks.lora"
network_dim = 32
network_alpha = 16.0
network_dropout = 0.0

[training]
base_model_path = "/content/drive/MyDrive/Colab_LoRA_Studio/models/sd15/v1-5-pruned-emaonly.safetensors"
model_family = "sd15"
output_name = "sd15_custom_lora"
output_dir = "/content/drive/MyDrive/Colab_LoRA_Studio/outputs/final_loras"
checkpoint_dir = "/content/drive/MyDrive/Colab_LoRA_Studio/outputs/checkpoints"
sample_dir = "/content/drive/MyDrive/Colab_LoRA_Studio/outputs/samples"
logging_dir = "/content/drive/MyDrive/Colab_LoRA_Studio/outputs/logs"

epochs = 10
save_every_n_epochs = 1
save_every_n_steps = 200
save_state = true

batch_size = 4
gradient_accumulation_steps = 1
learning_rate = 0.0001
text_encoder_lr = 0.00005
optimizer_type = "AdamW8bit"
lr_scheduler = "cosine"
lr_warmup_steps = 100
mixed_precision = "fp16"
gradient_checkpointing = true
cache_latents = true
cache_latents_to_disk = true
