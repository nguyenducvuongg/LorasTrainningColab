[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omni-lora"
version = "1.0.0"
description = "OmniLoRA Studio: Professional All-in-One Multi-Model LoRA Training Suite for Google Colab & Cloud GPUs with 100% Likeness Engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    { name = "OmniLoRA Team", email = "contact@omnilorastudio.ai" }
]
keywords = [
    "lora", "flux", "sdxl", "sd3.5", "sd15", "krea2", "kolors", "wan2.1",
    "diffusion", "google-colab", "ai-art", "dora", "deep-learning"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "numpy>=1.24.0"
]

[project.optional-dependencies]
train = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "accelerate>=0.28.0",
    "diffusers>=0.28.0",
    "transformers>=4.40.0",
    "safetensors>=0.4.2",
    "peft>=0.10.0",
    "bitsandbytes>=0.43.0",
    "prodigyopt>=1.0.0",
    "sentencepiece>=0.2.0"
]
vision = [
    "insightface>=0.7.3",
    "onnxruntime-gpu>=1.17.0",
    "opencv-python-headless>=4.9.0",
    "timm>=0.9.16"
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0"
]

[project.scripts]
omni-lora = "omni_lora.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omni_lora"]
