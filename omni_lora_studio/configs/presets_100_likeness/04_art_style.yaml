objective: "art_style"
description: "Huấn luyện bắt trọn nét cọ, tông màu và phong cách nghệ thuật hội họa / anime / đồ họa"

dataset:
  repeats: 10
  resolution: 1024
  enable_bucketing: true
  auto_caption: true
  caption_backend: "florence2"
  subject_decoupling: false

training:
  network_dim: 32
  network_alpha: 16
  use_dora: false
  optimizer_type: "Prodigy"
  learning_rate: 1.0
  epochs: 18
  batch_size: 2
  gradient_accumulation_steps: 1

validation:
  enabled: true
  compute_likeness_score: false
